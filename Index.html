<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 50px 15px;
        }

        .card {
            background: white;
            color: #333;
            max-width: 320px;
            margin: auto;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #2224;
        }

        .foto {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #ddd;
            object-fit: cover;
        }

        h1 {
            font-size: 26px;
        }

        p {
            color: #666;
        }

        a {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <img class="foto"
             src="https://placehold.co/150x150"
             alt="Foto profil">

        <h1>My Profile</h1>

        <h3>Nama: Ade Nur Saskia</h3>

        <p>Halo! Selamat datang di profil saya.</p>

        <p>Hobi: Musik, membaca, dan belajar coding.</p>

        <a href="https://instagram.com/"
           target="_blank">
           Instagram Saya
        </a>
    </div>
</body>
</html>
